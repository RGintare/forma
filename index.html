<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forma</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1f8a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forma">
<style>
/* Layout: viena kolona, apacioje juosta su 4 skiltimis; telefonui */
:root{--bg:#f2f6f4;--card:#fff;--ink:#12261f;--mute:#5d726a;--line:#dde7e2;--food:#1f8a5b;--sport:#e8663d;--water:#2f7fd1;--on:#fff;
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17231f;--ink:#e8f1ed;--mute:#93a9a0;--line:#26362f;--food:#3fc088;--sport:#ff8a63;--water:#5aa5f0;--on:#08130e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#17231f;--ink:#e8f1ed;--mute:#93a9a0;--line:#26362f;--food:#3fc088;--sport:#ff8a63;--water:#5aa5f0;--on:#08130e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg,var(--ink));font:16px/1.4 var(--fb);padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 26px var(--fd);margin:0}
h2{font:600 13px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.big{font:700 40px var(--fd);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--food);max-width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats b{display:block;font:700 20px var(--fd);font-variant-numeric:tabular-nums}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--food);outline-offset:2px}
button{font:600 15px var(--fb);border:0;border-radius:10px;padding:12px 16px;background:var(--food);color:var(--on);cursor:pointer}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mute);padding:6px 10px;font-size:20px}
.sport button.go{background:var(--sport)}
.form{display:grid;grid-template-columns:1fr 90px;gap:8px}
.form button{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 11px;font-size:13px;font-weight:500}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.week{display:flex;gap:6px;align-items:flex-end;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--mute)}
.week i{width:100%;background:var(--food);border-radius:5px 5px 0 0;min-height:2px}
.water{display:flex;gap:6px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{flex:1;background:none;color:var(--mute);padding:10px 4px;font-size:13px}
nav button[aria-current=true]{color:var(--food)}
.mf{grid-template-columns:repeat(3,1fr)}.mf .w{grid-column:span 2}
.mac{display:grid;gap:10px}.mac span{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar.p i{background:var(--water)}.bar.f i{background:var(--sport)}.bar.c i{background:var(--food)}
.chips button[aria-pressed=true]{background:var(--sport);color:var(--on);border-color:transparent}
.chips.eq button[aria-pressed=true]{background:var(--food)}
.ex small{display:block;color:var(--mute);font-size:13px}
.ex a{display:inline-block;margin-top:4px;color:var(--sport);font-size:14px;font-weight:600;text-decoration:none}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
</style>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const TABS=[['today','Šiandien'],['food','Maistas'],['sport','Sportas'],['plan','Planas'],['goals','Tikslai']];
const FOODS=[['Obuolys',80,0,0,20],['Kiaušinis',70,6,5,0],['Avižų košė',150,5,3,27],['Vištienos krūtinėlė',165,31,4,0],['Jogurtas',100,10,3,6],['Duona (riekė)',80,3,1,15],['Varškė 150 g',130,24,2,5],['Tunas 100 g',120,26,1,0],['Lašiša 100 g',200,20,13,0],['Bananas',105,1,0,27],['Ryžiai virti 150 g',195,4,0,43],['Riešutai 30 g',180,5,16,5],['Avokadas',240,3,22,13],['Brokoliai 200 g',70,6,1,14],['Lęšiai virti 150 g',175,13,1,30],['Sūris 30 g',110,7,9,0]];
const EQ=[['tread','Bėgimo takelis'],['bike','Dviratis'],['ellip','Eliptinis'],['rower','Irklavimo'],['db','Hanteliai'],['bb','Štanga ir stovas'],['bench','Suoliukas'],['lat','Viršutinė trauka'],['row','Sėdima trauka'],['cable','Lynų blokas'],['legp','Kojų presas'],['legc','Kojų tiesimas/lenkimas'],['chest','Krūtinės spaudimas'],['shoulder','Pečių spaudimas'],['smith','Smito mašina'],['hyper','Hiperekstenzija'],['func','Funkcinė zona'],['mat','Kilimėlis']];
// ex: [pavadinimas, reikalinga bent viena iš įrangos, serijos]; tuščias sąrašas = be įrangos
const GOALS={
back:['Stiprinti nugarą',250,'Trauką darykite lėtai, mentes suveskite. Stebėkite, kad nugara būtų tiesi.',[['Viršutinė trauka',['lat','cable'],'3×12'],['Sėdima trauka',['row','cable'],'3×12'],['Trauka hanteliu viena ranka',['db'],'3×10'],['Štangos trauka',['bb'],'3×8'],['Hiperekstenzija',['hyper'],'3×12'],['Supermenas',['mat'],'3×12'],['Lenta',[],'3×30 s']]],
weight:['Mesti svorį',350,'Daugiau judėjimo ir kalorijų deficitas. 3-4 treniruotės per savaitę, pradėkite nuo kardio.',[['Bėgimas takeliu',['tread'],'20 min'],['Dviratis arba eliptinis',['bike','ellip','rower'],'15 min'],['Kojų presas',['legp','smith'],'3×15'],['Pritūpimai su hanteliu',['db'],'3×15'],['Krūtinės spaudimas',['chest','db'],'3×15'],['Viršutinė trauka',['lat','cable'],'3×15'],['Intervalai (šuoliai, burpee)',['func','mat'],'4×30 s'],['Pritūpimai su savo svoriu',[],'3×20']]],
chest:['Krūtinė ir pečiai',270,'Svorį rinkitės tokį, kad paskutiniai 2 pakartojimai būtų sunkūs.',[['Krūtinės spaudimas',['chest'],'3×10'],['Spaudimas hanteliais',['db','bench'],'3×10'],['Spaudimas štanga',['bb','bench'],'3×8'],['Pečių spaudimas',['shoulder','db'],'3×10'],['Kėlimai į šonus hanteliais',['db'],'3×12'],['Atsispaudimai',[],'3×12']]],
legs:['Kojos ir sėdmenys',300,'Šildymas ir gili technika svarbiau už svorį.',[['Kojų presas',['legp'],'3×12'],['Pritūpimai Smito mašinoje',['smith'],'3×10'],['Pritūpimai su štanga',['bb'],'3×8'],['Kojų tiesimas',['legc'],'3×12'],['Kojų lenkimas',['legc'],'3×12'],['Dūriai su hanteliais',['db'],'3×10'],['Sėdmenų tiltelis',['mat'],'3×15'],['Pritūpimai su savo svoriu',[],'3×20']]],
abs:['Pilvo presas',200,'Pilvo raumenys matosi tik su mažesniu kūno riebalų kiekiu. Derinkite su kardio.',[['Lenta',[],'3×40 s'],['Kėlimai gulint',['mat'],'3×15'],['Lynų gniaužimas',['cable'],'3×12'],['Rusiškas sukimas',['mat','db'],'3×20'],['Kojų kėlimas',['func','mat'],'3×12']]],
arms:['Rankos',200,'Biceps ir triceps atsigauna greitai, bet duokite dienai pailsėti.',[['Bicepso lenkimas su hanteliais',['db'],'3×12'],['Tricepso išitiesimas lynu',['cable'],'3×12'],['Lenkimas štanga',['bb'],'3×10'],['Atvirkštiniai atsispaudimai',['bench'],'3×12'],['Atsispaudimai siaurai',[],'3×12']]]};
const EN={'Viršutinė trauka':'lat pulldown','Sėdima trauka':'seated cable row','Trauka hanteliu viena ranka':'one arm dumbbell row','Štangos trauka':'barbell bent over row','Hiperekstenzija':'back extension machine','Supermenas':'superman back exercise','Lenta':'plank','Bėgimas takeliu':'treadmill running','Dviratis arba eliptinis':'elliptical machine','Kojų presas':'leg press','Pritūpimai su hanteliu':'goblet squat','Krūtinės spaudimas':'chest press machine','Intervalai (šuoliai, burpee)':'burpee','Pritūpimai su savo svoriu':'bodyweight squat','Spaudimas hanteliais':'dumbbell bench press','Spaudimas štanga':'barbell bench press','Pečių spaudimas':'shoulder press machine','Kėlimai į šonus hanteliais':'dumbbell lateral raise','Atsispaudimai':'push up','Pritūpimai Smito mašinoje':'smith machine squat','Pritūpimai su štanga':'barbell back squat','Kojų tiesimas':'leg extension machine','Kojų lenkimas':'leg curl machine','Dūriai su hanteliais':'dumbbell lunge','Sėdmenų tiltelis':'glute bridge','Kėlimai gulint':'crunch','Lynų gniaužimas':'cable crunch','Rusiškas sukimas':'russian twist','Kojų kėlimas':'lying leg raise','Bicepso lenkimas su hanteliais':'dumbbell bicep curl','Tricepso išitiesimas lynu':'cable triceps pushdown','Lenkimas štanga':'barbell curl','Atvirkštiniai atsispaudimai':'bench dips','Atsispaudimai siaurai':'close grip push up'};
const vid=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent((EN[n]||n)+' proper form tutorial');
const MAC=[['p','Baltymai'],['f','Riebalai'],['c','Angliavandeniai']];
const SPORTS=[['Bėgimas 30 min',300],['Ėjimas 30 min',120],['Jėgos treniruotė 45 min',250],['Joga 30 min',100],['Dviratis 30 min',210]];
let S={goal:{kcal:2000,water:2000,p:120,f:70,c:250},days:{}},tab='today';
try{const s=JSON.parse(localStorage.getItem('forma'));if(s)S=s;S.goal={p:120,f:70,c:250,...S.goal}}catch(e){}
const save=()=>{try{localStorage.setItem('forma',JSON.stringify(S))}catch(e){}};
const key=d=>d.toLocaleDateString('sv');
const day=k=>S.days[k]||(S.days[k]={meals:[],sport:[],water:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
S.eq=S.eq||Object.fromEntries(EQ.map(e=>[e[0],1]));
const sum=(a,f)=>a.reduce((t,x)=>t+(x[f]||0),0);
const T=key(new Date());
const chips=(l,t)=>`<div class="chips">${l.map((x,i)=>`<button class="ghost" data-chip="${t}${i}">${esc(x[0])} · ${x[1]}</button>`).join('')}</div>`;
const list=(a,t)=>a.length?`<ul>${a.map((x,i)=>`<li><span>${esc(x.n)}</span><span class="row">${x.k} kcal${x.p||x.f||x.c?` <span class="mute">B${x.p||0} R${x.f||0} A${x.c||0}</span>`:''}<button class="x" data-del="${t}${i}" aria-label="Šalinti">×</button></span></li>`).join('')}</ul>`:'<div class="empty">Dar nieko nėra.</div>';

function coach(d,left){
 const last={};Object.keys(S.days).sort().forEach(k=>S.days[k].sport.forEach(x=>{if(x.g)last[x.g]=k}));
 const ago=g=>last[g]?Math.round((new Date(T)-new Date(last[g]))/864e5):99;
 const pick=Object.keys(GOALS).filter(g=>g!=='weight').sort((a,b)=>ago(b)-ago(a))[0];
 const tr=d.sport.length?`<p class="mute" style="margin:0">Šiandien jau sportavai. Gerai, pailsėk ir gerk vandens.</p>`:`<div><b>${GOALS[pick][0]}</b><div class="mute">${ago(pick)===99?'Dar netreniravai.':'Paskutinį kartą prieš '+ago(pick)+' d.'}</div></div><button data-trainer="${pick}">Atidaryti planą</button>`;
 const need=['p','f','c'].map(k=>[k,(S.goal[k]-sum(d.meals,k))/S.goal[k]]).sort((a,b)=>b[1]-a[1])[0][0],ix={p:2,f:3,c:4}[need];
 const sug=left>40?FOODS.map((x,i)=>[x,i]).filter(([x])=>x[1]<=left).sort((a,b)=>b[0][ix]/b[0][1]-a[0][ix]/a[0][1]).slice(0,3):[];
 const nm=MAC.find(m=>m[0]===need)[1].toLowerCase();
 return `<div class="card"><h2>Treneris siūlo</h2><div class="row sp">${tr}</div></div>
 <div class="card"><h2>Ką valgyti toliau</h2>${sug.length?`<p class="mute" style="margin:0">Dar trūksta daugiausiai: ${nm}. Tinka:</p><div class="chips">${sug.map(([x,i])=>`<button class="ghost" data-chip="f${i}">+ ${esc(x[0])} · ${x[1]} kcal</button>`).join('')}</div>`:'<p class="mute" style="margin:0">Kalorijų limitas beveik pasiektas.</p>'}</div>`;
}
function view(){
 const d=day(T),eaten=sum(d.meals,'k'),burned=sum(d.sport,'k'),left=S.goal.kcal-eaten+burned;
 if(tab==='today'){
  const wk=[...Array(7)].map((_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);const k=key(dt);return[dt.toLocaleDateString('lt',{weekday:'short'}).slice(0,2),sum((S.days[k]||{meals:[]}).meals,'k')]});
  const mx=Math.max(S.goal.kcal,...wk.map(w=>w[1]));
  return `<h1>Šiandien</h1>
  <div class="card"><h2>Kalorijos</h2><div class="big">${left}</div><div class="mute">liko iš ${S.goal.kcal} kcal</div>
  <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,eaten/S.goal.kcal*100)}%"></i></div>
  <div class="stats"><div><b>${eaten}</b><span class="mute">suvalgyta</span></div><div><b style="color:var(--sport)">${burned}</b><span class="mute">sudeginta</span></div><div><b>${d.meals.length+d.sport.length}</b><span class="mute">įrašų</span></div></div></div>
  ${coach(d,left)}
  <div class="card"><h2>Makroelementai (g)</h2><div class="mac">${MAC.map(m=>{const v=sum(d.meals,m[0]),g=S.goal[m[0]];return `<div><span><b>${m[1]}</b><span>${v} / ${g}</span></span><div class="bar ${m[0]}"><i style="width:${Math.min(100,v/g*100)}%"></i></div></div>`}).join('')}</div></div>
  <div class="card"><h2>Vanduo</h2><div class="row sp"><div><span class="big" style="color:var(--water)">${d.water}</span> <span class="mute">/ ${S.goal.water} ml</span></div></div>
  <div class="bar" style="margin:8px 0 12px"><i style="width:${Math.min(100,d.water/S.goal.water*100)}%;background:var(--water)"></i></div>
  <div class="water"><button data-w="250">+250 ml</button><button data-w="500">+500 ml</button><button class="ghost" data-w="-250">−250</button></div></div>
  <div class="card"><h2>Savaitė (kcal)</h2><div class="week">${wk.map(w=>`<div>${w[1]||''}<i style="height:${w[1]/mx*60}px"></i>${w[0]}</div>`).join('')}</div></div>`;
 }
 if(tab==='food')return `<h1>Maistas</h1><form class="card form mf" id="fm"><input class="w" id="fn" placeholder="Pavadinimas" required><input id="fk" type="number" inputmode="numeric" min="0" placeholder="kcal"><input id="fp" type="number" inputmode="decimal" min="0" placeholder="Baltymai g"><input id="ff" type="number" inputmode="decimal" min="0" placeholder="Riebalai g"><input id="fc" type="number" inputmode="decimal" min="0" placeholder="Angliav. g"><button>Pridėti</button></form>
  <div class="card"><h2>Greitai pridėti</h2>${chips(FOODS,'f')}</div><div class="card"><h2>Šiandien · ${eaten} kcal</h2>${list(d.meals,'m')}</div>`;
 if(tab==='plan'){const g=GOALS[S.plan],ex=g&&g[3].filter(x=>!x[1].length||x[1].some(q=>S.eq[q]));
  return `<h1>Planas</h1><div class="card"><h2>Ką šiandien stiprinam?</h2><div class="chips">${Object.entries(GOALS).map(([k,v])=>`<button class="ghost" data-goalsel="${k}" aria-pressed="${S.plan===k}">${v[0]}</button>`).join('')}</div></div>
  ${g?`<div class="card"><h2>${g[0]}</h2><p class="mute" style="margin:0 0 6px">${g[2]}</p><ul>${ex.map(x=>`<li class="ex"><span>${x[0]}<small>${x[1].length?x[1].map(q=>EQ.find(e=>e[0]===q)[1]).join(' / '):'Be įrangos'}</small><a href="${vid(x[0])}" target="_blank" rel="noopener">▶ Kaip atlikti (video)</a></span><b>${x[2]}</b></li>`).join('')}</ul><button class="go" style="width:100%;margin-top:10px;background:var(--sport)" data-done="1">Atlikta (~45 min, ${g[1]} kcal)</button></div>`:'<div class="empty">Pasirink tikslą ir gausi pratimų sąrašą pagal turimą įrangą.</div>'}
  <div class="card"><h2>Mano klubo įranga</h2><p class="mute" style="margin:0 0 4px">LemonGym Pilaitė (Vydūno g. 2): klubo puslapyje nurodytos laisvų svorių, funkcinė ir kardio zonos. Tikslaus treniruoklių sąrašo ten nėra, todėl pažymėta tipinė įranga. Atžymėk, ko klube nėra.</p><div class="chips eq">${EQ.map(e=>`<button class="ghost" data-eq="${e[0]}" aria-pressed="${!!S.eq[e[0]]}">${e[1]}</button>`).join('')}</div></div>`;}
 if(tab==='sport')return `<h1>Sportas</h1><form class="card form sport" id="sm"><input id="sn" placeholder="Veikla" required><input id="sk" type="number" inputmode="numeric" min="0" placeholder="kcal" required><button class="go">Pridėti</button></form>
  <div class="card"><h2>Greitai pridėti</h2>${chips(SPORTS,'s')}</div><div class="card"><h2>Šiandien · ${burned} kcal</h2>${list(d.sport,'s')}</div>`;
 return `<h1>Tikslai</h1><form class="card" id="gm" style="display:flex;flex-direction:column;gap:10px"><label class="mute" for="gk">Dienos kalorijos (kcal)</label><input id="gk" type="number" inputmode="numeric" min="500" value="${S.goal.kcal}"><label class="mute" for="gw">Vanduo per dieną (ml)</label><input id="gw" type="number" inputmode="numeric" min="500" step="250" value="${S.goal.water}"><label class="mute" for="gp">Baltymai (g)</label><input id="gp" type="number" inputmode="numeric" min="0" value="${S.goal.p}"><label class="mute" for="gf">Riebalai (g)</label><input id="gf" type="number" inputmode="numeric" min="0" value="${S.goal.f}"><label class="mute" for="gc">Angliavandeniai (g)</label><input id="gc" type="number" inputmode="numeric" min="0" value="${S.goal.c}"><button>Išsaugoti</button></form>
  <p class="mute">Duomenys saugomi tik šiame telefone. Kalorijų skaičiai apytiksliai, tai ne medicininė rekomendacija.</p>`;
}
function render(){
 app.innerHTML=view();
 nav.innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" aria-current="${t[0]===tab}">${t[1]}</button>`).join('');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=day(T),D=b.dataset;
 if(D.tab)tab=D.tab;
 else if(D.trainer){S.plan=D.trainer;tab='plan'}
 else if(D.goalsel)S.plan=D.goalsel
 else if(D.eq)S.eq[D.eq]=S.eq[D.eq]?0:1
 else if(D.done&&GOALS[S.plan]){const g=GOALS[S.plan];d.sport.push({n:g[0]+' (~45 min)',k:g[1],g:S.plan});tab='sport'}
 else if(D.w)d.water=Math.max(0,d.water+ +D.w);
 else if(D.chip){const i=+D.chip.slice(1),f=D.chip[0]==='f',x=(f?FOODS:SPORTS)[i];(f?d.meals:d.sport).push(f?{n:x[0],k:x[1],p:x[2],f:x[3],c:x[4]}:{n:x[0],k:x[1]})}
 else if(D.del)d[D.del[0]==='m'?'meals':'sport'].splice(+D.del.slice(1),1);
 else return;
 save();render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const d=day(T),v=i=>document.getElementById(i).value;
 if(e.target.id==='fm'){const p=+v('fp'),f=+v('ff'),c=+v('fc'),k=+v('fk')||Math.round(4*p+9*f+4*c);if(!k)return;d.meals.push({n:v('fn').trim(),k,p,f,c})}
 else if(e.target.id==='sm')d.sport.push({n:v('sn').trim(),k:+v('sk')});
 else S.goal={kcal:+v('gk')||2000,water:+v('gw')||2000,p:+v('gp')||120,f:+v('gf')||70,c:+v('gc')||250};
